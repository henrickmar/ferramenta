<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ferramentaria - Controle de Ferramentas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="app">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-mark">FT</div>
        <div class="sidebar-brand-text">Ferramentaria</div>
      </div>

      <button class="nav-item active" data-page="proprias">
        Ferramentas Próprias
      </button>

      <button class="nav-item" data-page="alugadas">
        Ferramentas Alugadas
      </button>

      <button class="nav-item" data-page="obras">
        Obras
      </button>

      <button class="nav-item" data-page="historico">
        Histórico
      </button>

      <button class="nav-item" data-page="relatorios">
        Relatórios
      </button>
    </aside>

    <main class="main">
      <div id="messages"></div>
      <div id="content"></div>
    </main>
  </div>

  <!-- Modal -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div id="modalContent" class="modal"></div>
  </div>

  <script src="script.js"></script>

</html>
