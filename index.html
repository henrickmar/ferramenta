<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ferramentaria - Controle de Ferramentas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="app">

    <!-- MENU LATERAL -->
    <aside class="sidebar">

      <div class="sidebar-brand">
        <div class="sidebar-brand-mark">FT</div>
        <div class="sidebar-brand-text">Ferramentaria</div>
      </div>

      <button class="nav-item active" data-page="proprias">
        Ferramentas Próprias
      </button>

      <button class="nav-item" data-page="alugadas">
        Ferramentas Alugadas
      </button>

      <button class="nav-item" data-page="obras">
        Obras
      </button>

      <button class="nav-item" data-page="historico">
        Histórico
      </button>

      <button class="nav-item" data-page="relatorios">
        Relatórios
      </button>

    </aside>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="main">

      <!-- Mensagens de erro/sucesso -->
      <div id="messages"></div>

      <!-- Conteúdo das páginas -->
      <div id="content"></div>

    </main>

  </div>


  <!--
    CONTADORES DO TOPO

    O JavaScript vai preencher:
    #totalFerramentas
    #totalAlocadas
  -->

  <div id="headerStats" class="header-stats">

    <!-- Ferramentas cadastradas -->
    <div class="stat-block">
      <div
        class="stat-number"
        id="totalFerramentas"
      >
        0
      </div>

      <div class="stat-label">
        Cadastradas
      </div>
    </div>


    <!-- Ferramentas alocadas -->
    <div
      class="stat-block"
      id="boxAlocadas"
    >

      <div
        class="stat-number"
        id="totalAlocadas"
      >
        0
      </div>

      <div class="stat-label">
        Alocadas
      </div>

    </div>

  </div>


  <!-- MODAL -->
  <div
    id="modalOverlay"
    class="modal-overlay hidden"
  >

    <div
      id="modalContent"
      class="modal"
    ></div>

  </div>


  <!-- JAVASCRIPT -->
  <script src="script.js"></script>

</body>
</html>
